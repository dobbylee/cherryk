name: Deploy Backend
run-name: Deploy backend ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_REPOSITORY: ghcr.io/dobbylee/cherryk-backend
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate exact deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
          remote_main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          test "$remote_main" = "$DEPLOY_SHA"

      - name: Build and publish ARM64 backend image
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build \
            --platform linux/arm64 \
            --tag "${IMAGE_REPOSITORY}:${DEPLOY_SHA}" \
            backend
          docker push "${IMAGE_REPOSITORY}:${DEPLOY_SHA}"

          remote_main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          test "$remote_main" = "$DEPLOY_SHA"

          image_digest=$(
            docker image inspect "${IMAGE_REPOSITORY}:${DEPLOY_SHA}" \
              --format '{{index .RepoDigests 0}}' |
              cut -d@ -f2
          )
          [[ $image_digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

  deploy:
    needs: build
    environment: Production
    runs-on: [self-hosted, Linux, ARM64, cherryk-production]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
    steps:
      - name: Deploy exact image with automatic rollback
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          printf '%s\n%s\n%s\n%s\n' \
            "$DEPLOY_SHA" \
            "$IMAGE_DIGEST" \
            "$GITHUB_ACTOR" \
            "$GHCR_TOKEN" |
            sudo /usr/local/sbin/cherryk-deploy-backend-from-ghcr
