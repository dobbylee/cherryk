name: CI

on:
  push:
    branches: [preview, main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find successful Preview verification
        id: preview-verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          reuse=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if successful_runs=$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=preview \
              -f event=push \
              -f status=success \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=1 \
              --jq '.total_count'); then
              if ((successful_runs > 0)); then
                reuse=true
              fi
            else
              echo "Preview verification lookup failed; running the full gate on main" >&2
            fi
          fi

          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          if [[ "$reuse" == true ]]; then
            echo "Reusing successful Preview CI for $GITHUB_SHA"
          else
            echo "Running the full verification gate for $GITHUB_SHA"
          fi

      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: steps.preview-verification.outputs.reuse != 'true'
      # v6.0.8
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        if: steps.preview-verification.outputs.reuse != 'true'
      # v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: steps.preview-verification.outputs.reuse != 'true'
        with:
          node-version: 24
          cache: pnpm
      # v5.6.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        if: steps.preview-verification.outputs.reuse != 'true'
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle/wrapper/gradle-wrapper.properties
      - run: pnpm install --frozen-lockfile
        if: steps.preview-verification.outputs.reuse != 'true'
      - run: pnpm test
        if: steps.preview-verification.outputs.reuse != 'true'
      - run: pnpm build
        if: steps.preview-verification.outputs.reuse != 'true'
        env:
          SPRING_BACKEND_ORIGIN: https://api-preview.cherryk.kr
      - run: pnpm build:backend
        if: steps.preview-verification.outputs.reuse != 'true'
      - run: pnpm compose:check
        if: steps.preview-verification.outputs.reuse != 'true'
