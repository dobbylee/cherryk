# Local development only. Production uses the root-owned Compose file under
# /opt/cherryk and never deploys this repository file.
services:
  backend:
    profiles: ["backend"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://backend-postgres:5432/cherryk
      DATABASE_USERNAME: cherryk
      DATABASE_PASSWORD: cherryk
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-development-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-development-secret}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-local@cherryk.invalid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CHERRYK_LOCAL_LOGIN_ENABLED: ${CHERRYK_LOCAL_LOGIN_ENABLED:-true}
      CHERRYK_LOCAL_LOGIN_EMAIL: ${CHERRYK_LOCAL_LOGIN_EMAIL:-local@cherryk.invalid}
      CHERRYK_LOCAL_LOGIN_DISPLAY_NAME: ${CHERRYK_LOCAL_LOGIN_DISPLAY_NAME:-Local Learner}
      CHERRYK_MAINTENANCE_MODE: ${CHERRYK_MAINTENANCE_MODE:-off}
      CHERRYK_MAINTENANCE_BYPASS_TOKEN: ${CHERRYK_MAINTENANCE_BYPASS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      OPENAI_CORRECTION_TIMEOUT: ${OPENAI_CORRECTION_TIMEOUT:-30s}
      OPENAI_CORRECTION_MAX_ATTEMPTS: ${OPENAI_CORRECTION_MAX_ATTEMPTS:-1}
      OPENAI_CORRECTION_RETRY_DELAY: ${OPENAI_CORRECTION_RETRY_DELAY:-200ms}
      OPENAI_QUIZ_TIMEOUT: ${OPENAI_QUIZ_TIMEOUT:-15s}
      OPENAI_QUIZ_MAX_ATTEMPTS: ${OPENAI_QUIZ_MAX_ATTEMPTS:-2}
      OPENAI_QUIZ_RETRY_DELAY: ${OPENAI_QUIZ_RETRY_DELAY:-200ms}
      CLOVA_OCR_INVOKE_URL: ${CLOVA_OCR_INVOKE_URL:-}
      CLOVA_OCR_SECRET: ${CLOVA_OCR_SECRET:-}
      CLOVA_OCR_TIMEOUT: ${CLOVA_OCR_TIMEOUT:-10s}
      CLOVA_OCR_MAX_ATTEMPTS: ${CLOVA_OCR_MAX_ATTEMPTS:-2}
      CLOVA_OCR_RETRY_DELAY: ${CLOVA_OCR_RETRY_DELAY:-200ms}
      DAILY_CORRECTION_LIMIT: ${DAILY_CORRECTION_LIMIT:-20}
      DAILY_OCR_LIMIT: ${DAILY_OCR_LIMIT:-10}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend-postgres:
        condition: service_healthy

  backend-postgres:
    profiles: ["backend"]
    image: postgres:18
    environment:
      POSTGRES_DB: cherryk
      POSTGRES_USER: cherryk
      POSTGRES_PASSWORD: cherryk
    volumes:
      - backend_postgres18_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherryk -d cherryk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_postgres18_data:
