spring:
  application:
    name: cherryk-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cherryk}
    username: ${DATABASE_USERNAME:cherryk}
    password: ${DATABASE_PASSWORD:cherryk}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      idle-timeout: 20000
      max-lifetime: 1800000
  flyway:
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 90d
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/auth/callback/{registrationId}"
            scope:
              - openid
              - profile
              - email
  servlet:
    multipart:
      file-size-threshold: 6MB
      max-file-size: 5MB
      max-request-size: 6MB
      resolve-lazily: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: CHERRYK_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        max-age: 90d

cherryk:
  security:
    admin-emails: ${ADMIN_EMAILS:}
    secure-cookies: ${SESSION_COOKIE_SECURE:true}
  correction:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${AI_TEXT_MODEL:}
      reasoning-effort: ${AI_REASONING_EFFORT:}
      timeout: ${OPENAI_CORRECTION_TIMEOUT:10s}
      max-attempts: ${OPENAI_CORRECTION_MAX_ATTEMPTS:2}
      retry-delay: ${OPENAI_CORRECTION_RETRY_DELAY:200ms}
  ocr:
    clova:
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret: ${CLOVA_OCR_SECRET:}
      timeout: ${CLOVA_OCR_TIMEOUT:10s}
      max-attempts: ${CLOVA_OCR_MAX_ATTEMPTS:2}
      retry-delay: ${CLOVA_OCR_RETRY_DELAY:200ms}
  usage:
    daily-limits:
      correction: ${DAILY_CORRECTION_LIMIT:20}
      ocr: ${DAILY_OCR_LIMIT:10}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
