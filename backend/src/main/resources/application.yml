spring:
  application:
    name: cherryk-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cherryk}
    username: ${DATABASE_USERNAME:cherryk}
    password: ${DATABASE_PASSWORD:cherryk}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      idle-timeout: 20000
      max-lifetime: 1800000
  flyway:
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    timeout: 90d
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/auth/callback/{registrationId}"
            scope:
              - openid
              - profile
              - email

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: CHERRYK_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        max-age: 90d

cherryk:
  security:
    admin-emails: ${ADMIN_EMAILS:}
    secure-cookies: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
